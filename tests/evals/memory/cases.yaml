# Memory retrieval eval (synthetic only: every person, place and number here is made up).
#
# Categories follow LongMemEval: single-fact, preference, knowledge-update (supersede),
# multi-session, temporal, unanswerable. Most queries are in a different script from the
# memory or chat line they need (Devanagari <-> romanized Marathi <-> English).
#
# Memory keywords are written the way the OLD extraction prompt asked for them (English
# plus the user's own words in the script they used), so the offline numbers measure what
# the deterministic code adds, not what a better model prompt might add.
#
# evidence: a list of groups; a group is satisfied when ANY of its ids (memory id or
#   session id) is in the top 5 retrieved. Recall@5 = satisfied groups / groups.
# stale: ids holding an outdated answer (knowledge-update). Offline: counted when a stale
#   session ranks above every gold session. Live: `stale_values` in the answer.
# answer: checks for the opt-in live run (contains_any / not_contains); unanswerable
#   questions pass only when the answer declines.


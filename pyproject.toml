[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.0.1"
description = "Personal AI assistant, built phase by phase"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",   # Claude adapter only (jarvis/providers/claude.py)
    "keyring>=25",      # secrets in macOS Keychain / Windows Credential Manager
    "certifi>=2024",    # CA bundle when Python has none (python.org builds on macOS); see jarvis/netssl.py
    "pyyaml>=6",        # config/*.yaml
    "pypdf>=6",         # document library: text per PDF page, so answers can cite the page
    "python-docx>=1.2", # document library: DOCX text and headings
    "tzdata; sys_platform == 'win32'",  # Windows has no IANA time zones (Asia/Kolkata)
    "apscheduler>=3.10,<4",          # schedules: cron, misfire grace, coalesce, max_instances (v4 is pre-release)
    "python-telegram-bot>=21,<23",   # phone: long polling, inline Approve/Deny buttons
    "fastapi>=0.143",                # dashboard API (Phase 7), served on 127.0.0.1 only
    "uvicorn>=0.54",                 # dashboard server
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]  # httpx: FastAPI TestClient
# Voice (Phase 6). sounddevice: push-to-talk recording, ships PortAudio, no numpy needed.
# faster-whisper: local speech-to-text (CTranslate2, no torch); its model is downloaded by `jarvis voice setup`.
voice = ["sounddevice>=0.5.6", "faster-whisper>=1.2.1"]
voice-cloud = ["edge-tts>=7.2.8"]   # optional Marathi cloud voice, off by default
wakeword = ["openwakeword==0.6.0"]  # optional "hey jarvis", off by default
# Google Calendar + Gmail connectors (Phase 5): official API client and installed-app OAuth.
google = ["google-api-python-client>=2.201", "google-auth-oauthlib>=1.5"]
# Isolated browser (Phase 8): Playwright's own Chromium; the browser itself (~150-200 MB) is
# downloaded by `jarvis browser setup`, never automatically.
browser = ["playwright>=1.63"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real cloud provider (needs an API key and JARVIS_LIVE=1)"]

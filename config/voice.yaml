# Voice settings (PLAN.md 14). Machine-specific changes go in config/local.yaml under voice_file.

stt:
  # faster_whisper: local Whisper (CTranslate2). Weights are downloaded only by `jarvis voice setup`.
  engine: faster_whisper
  # base (148 MB), small (486 MB), small.en (486 MB), medium (1531 MB), large-v3-turbo (1622 MB).
  model: small
  device: cpu
  compute_type: int8       # int8 is the fastest CPU setting in the faster-whisper benchmark
  # en = English only (Whisper). mr = Marathi only. auto = Whisper detects the language; English
  # stays with Whisper, anything else goes to the Marathi engine (Jarvis expects English or Marathi).
  language: auto           # auto | en | mr (auto: English or Marathi only, see stt.py LanguageRouter)
  hotwords: "Jarvis"       # words the decoder is nudged toward (the name was often heard as "that was")
  min_confidence: 0.35     # below this Jarvis asks you to repeat instead of acting (Whisper's score is
                           # pessimistic on short clips: 0.45 rejected half of good 2-second requests)
  # Marathi speech-to-text, local: indicconformer | none (none = Whisper for Marathi too, which is weak).
  # indicconformer = AI4Bharat IndicConformer Marathi (MIT), ONNX int8, 138 MB, via onnx-asr.
  # Measured 2026-10-10 on 18 FLEURS Marathi test clips: WER 23%, CER 7.6% (Whisper small is far worse).
  marathi_engine: indicconformer

tts:
  engine: auto             # auto (windows_sapi on Windows, mac_say on macOS) | windows_sapi | mac_say
  voice: ""                # "" = system default. Windows e.g. "Microsoft Zira Desktop"; macOS e.g. "Rishi"
  rate: 0                  # Windows: -10..10. macOS: words per minute (0 = default)
  marathi:
    # Offline Marathi voice, local: mms_tts | none. mms_tts = Meta MMS-TTS Marathi (VITS, ONNX, 115 MB).
    # License: CC-BY-NC 4.0, non-commercial only (fine for Sachin's personal use). Marathi text uses it
    # first; then the cloud voice (if enabled); then the system voice. `jarvis voice setup` downloads it.
    offline_engine: mms_tts
    # edge-tts sends the text to Microsoft's online speech service (CLOUD). Off by default.
    # Even when on: P3 text is never sent, and nothing above max_privacy is sent.
    cloud_enabled: false
    engine: edge_tts
    voice: mr-IN-ManoharNeural
    max_privacy: P1        # cannot be raised above P1

recorder:
  sample_rate: 16000
  device: null             # null = system default input; see `jarvis voice devices`
  max_seconds: 30

# How to interrupt Jarvis while it speaks:
#   key   = press Enter (default; always works)
#   voice = also stop when the microphone hears speech (use headphones, or the speakers trigger it)
#   off   = never interrupt
barge_in: key

vad:
  threshold_rms: 900       # 16-bit level that counts as speech
  min_speech_ms: 240
  end_silence_ms: 900      # wake-word mode: this much silence ends an utterance

wake_word:
  # openWakeWord "hey_jarvis". Off by default. Last release 0.6.0 (Feb 2024); checked 2026-10-10 on the
  # M4 Mac with Python 3.13: installs and loads on onnxruntime. Pre-trained models: CC BY-NC-SA 4.0
  # (personal use). Model (about 6 MB): `jarvis voice setup --model hey_jarvis`.
  enabled: false
  engine: openwakeword
  model: hey_jarvis        # a pre-trained model name or a path to an .onnx file
  threshold: 0.5

# Keep recordings? Default no: audio is transcribed in memory and dropped.
store_audio: false

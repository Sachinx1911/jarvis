# Known AI providers. No secrets here: keys live in the OS secret store (keyring).
# Approval to actually use a provider is in routing.yaml (approved_providers).
providers:
  anthropic:
    kind: cloud
    secret: anthropic_api_key
  claude_code:
    kind: cloud       # same Claude models, reached through the local Claude Code CLI
    auth: subscription  # the user's Claude login (Max); no API key, no per-call billing
  fake:
    kind: test        # deterministic, offline; always allowed, sends nothing anywhere

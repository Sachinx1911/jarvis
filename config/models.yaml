    languages_verified: []
    source: documented
    via:
      # Claude Code CLI with the subscription login: tools only through JSON action mode,
      # no prompt-caching control, no streaming or images through Jarvis yet.
      claude_code: {tool_calling: single, prompt_caching: false, streaming: false, vision: false}
    price_usd_per_mtok: {input: 2.00, output: 10.00, cache_read: 0.20}
  claude-haiku-5-5:
    provider: anthropic

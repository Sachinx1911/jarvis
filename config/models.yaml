# Capability profiles. source: documented (from vendor docs) or measured (on this machine).
# An unknown capability counts as unsupported. languages_verified stays empty until measured.
# Prices: USD per 1M tokens, Anthropic docs list dated 2026-10-06.
models:
  claude-opus-5-5:
    provider: anthropic
    context_window: 1000000
    max_output: 128000
    tool_calling: parallel
    structured_output: json_schema
    vision: true
    streaming: true
    prompt_caching: true
    reasoning_control: true
    languages_verified: []
    source: documented
    via:
      # Claude Code CLI with the subscription login: tools only through JSON action mode,
      # no prompt-caching control, no streaming or images through Jarvis yet.
      claude_code: {tool_calling: single, prompt_caching: false, streaming: false, vision: false}
    price_usd_per_mtok: {input: 4.00, output: 20.00, cache_read: 0.20}
  claude-sonnet-5-5:

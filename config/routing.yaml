# Provider and model routing (PLAN.md section 16). Deterministic; every decision is logged.
# Machine-specific overrides go in config/local.yaml (git-ignored).
mode: cloud_primary          # cloud_primary (Stage A) | local_first (Stage C) | local_only (Stage D)
cloud_allowed: true
# 2026-10-10: Claude API not used for now; Claude runs through the subscription CLI.
approved_providers: [claude_code]

routes:
  main_chat:
    candidates:
      - {provider: claude_code, model: claude-opus-5-5, effort: medium}
    needs: []
    max_privacy: P1
    cloud_fallback: never    # never | ask | allowed (used from Stage C)
  memory_extractor:          # also: "remember this" enrichment
    candidates:
      - {provider: claude_code, model: claude-haiku-5-5, effort: low}
    needs: [structured_output]
    max_privacy: P1
    cloud_fallback: never
  quarantine:                # reads untrusted web content; never gets tools
    candidates:
      - {provider: claude_code, model: claude-haiku-5-5, effort: low}
    needs: [structured_output]
    max_privacy: P1
    cloud_fallback: never
  # Phase 3: task planner and agent team (PLAN.md section 9). Worker models can be
  # switched per task with --workers (profiles in config/tasks.yaml).
  planner:
    candidates:
      - {provider: claude_code, model: claude-opus-5-5, effort: high}
    needs: [structured_output]
    max_privacy: P1
    cloud_fallback: never
  researcher:
    candidates:
      - {provider: claude_code, model: claude-opus-5-5, effort: low}
    needs: [tools]
    max_privacy: P1
    cloud_fallback: never
  writer:
    candidates:
      - {provider: claude_code, model: claude-opus-5-5, effort: low}
    needs: [tools]
    max_privacy: P1
    cloud_fallback: never
  checker:                   # never weaker than the workers
    candidates:
      - {provider: claude_code, model: claude-opus-5-5, effort: high}
    needs: [tools]
    max_privacy: P1
    cloud_fallback: never
  task_summary:
    candidates:
      - {provider: claude_code, model: claude-haiku-5-5, effort: low}
    needs: [structured_output]
    max_privacy: P1
    cloud_fallback: never
  skill_draft:
    candidates:
      - {provider: claude_code, model: claude-opus-5-5, effort: medium}
    needs: [structured_output]
    max_privacy: P1
    cloud_fallback: never

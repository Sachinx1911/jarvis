# Proactive features: schedules, heartbeat, daily brief, reminders, Telegram (PLAN.md 10.3, 12, 13).
# Machine-specific values go in config/local.yaml under `proactive_file:` (git-ignored), e.g.
#   proactive_file:
#     brief: {place: "Some City"}
#     telegram: {allowed_user_id: 123456789}
# The Telegram bot token is a secret: `jarvis telegram set-token` (OS secret store, never a file).

timezone: Asia/Kolkata

# No heartbeat messages in this window (reminders the user asked for still arrive).
quiet_hours: {start: "22:30", end: "07:00"}

schedules:
  misfire_grace_minutes: 60   # a run missed (machine asleep/off) is done once on wake if within this window, else skipped
  default_output: telegram    # telegram | file | both
  default_budget: {max_model_calls: 12, max_notional_usd: 0.5}
  alert_missed: true          # tell Sachin when a run was missed (asleep/off past the grace window)
  missed_alert_quiet_kinds: [heartbeat, memory_extract]   # frequent checks: no missed-run notice
  stale_lock_hours: 6         # a "running" mark older than this is treated as a crash leftover
  sync_seconds: 60            # the daemon re-reads schedules changed from the CLI this often

# Global daily cap and runaway guard for ALL unattended work (schedules and trigger actions).
# One runaway loop must not burn the day's model allowance (Hermes masterclass review, 2026-10-10).
# Counted per local day from the run receipts; a run counts only if it made a model call.
# A `run-now` that Sachin starts himself is counted but never blocked. Plain notifications are free.
unattended:
  daily_cap: {max_runs: 100, max_model_calls: 200, max_notional_usd: 5.0}
  pause_after_failures: 3     # pause a schedule or trigger after this many failed runs in a row (0 = never)

heartbeat:
  enabled: true
  every_minutes: 30
  repeat_after_hours: 6       # do not repeat the same message within this time

brief:
  enabled: true
  cron: "0 8 * * *"           # every day at 08:00 in `timezone`
  place: ""                   # default weather place; set it in config/local.yaml
  output: telegram

reminders:
  check_seconds: 30

telegram:
  allowed_user_id: null       # the only Telegram user Jarvis talks to; set in config/local.yaml
  approval_timeout_seconds: 300  # no answer in time = denied
  secret: telegram_bot_token

# Extra provider routes for this module only. They are added in memory to the routes from
# config/routing.yaml (which stays untouched), and go through the same routing policy
# (approved providers, cloud_allowed, capabilities).
routes:
  schedule_parser:            # only for schedule text the deterministic parser cannot read
    candidates:
      - {provider: claude_code, model: claude-haiku-5-5, effort: low}
    needs: [structured_output]
    max_privacy: P1
    cloud_fallback: never
  heartbeat:                  # decides whether anything on HEARTBEAT.md is worth telling
    candidates:
      - {provider: claude_code, model: claude-haiku-5-5, effort: low}
    needs: [structured_output]
    max_privacy: P1
    cloud_fallback: never

# Actions that unattended runs queued for approval (`/approvals` on Telegram,
# `jarvis schedule approvals`). Approving replays the exact queued call once.
approvals:
  replay_max_age_hours: 24    # older items can no longer be approved (stale)

# Event triggers (jarvis/proactive/triggers.py): run a prompt, skill or agent task, or just
# send a message, when something happens. `jarvis trigger add "..."`, Telegram /triggers.
triggers:
  enabled: true
  poll_seconds: 60              # how often the daemon looks for triggers that are due
  default_cooldown_minutes: 10  # after a fire, new items wait this long (they are not dropped)
  max_events_per_fire: 10       # more new items than this wait for the next check
  max_backoff_hours: 6          # a failing check retries later and later, up to this
  tavily_daily_credits: 15      # all triggers together; the free plan has 1000 credits a month
  file_new: {every_minutes: 2}
  email_from: {every_minutes: 5, lookback_days: 2, max_results: 20}
  calendar_soon: {every_minutes: 5}
  web_price:
    every_hours: 6
    min_every_hours: 2          # never more often than this (store pages, Tavily credits)
    ignore_below_fraction: 0.3  # amounts under 30% of the limit are EMI or accessories, not the price
  web_search_new: {every_hours: 6, min_every_hours: 1, max_results: 5}
